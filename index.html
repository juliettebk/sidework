<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Server Sidework</title>
<style>
  :root{
    --bg: #191919;
    --panel: #1f1f1f;
    --row-hover: #232323;
    --border: rgba(255,255,255,0.08);
    --text: #e9e9e7;
    --text-dim: #9b9b98;
    --text-faint: #6f6f6c;
    --grey-pill-bg: #3a3a38;
    --grey-pill-dot: #9b9b98;
    --red-pill-bg: #4a2626;
    --red-pill-text: #ff9a9a;
    --red-pill-dot: #ff6b6b;
    --blue-pill-bg: #1f3a52;
    --blue-pill-text: #8ec5f0;
    --blue-pill-dot: #5aa8e8;
    --green-pill-bg: #223b2b;
    --green-pill-text: #8fe3ac;
    --green-pill-dot: #4dd980;
    --chip-bg: #2b2b2b;
    --accent: #5b8def;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:32px 40px 60px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:6px;flex-wrap:wrap;}
  h1{font-size:30px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;}
  .subtitle{color:var(--text-dim);font-size:14px;margin:0;}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select, .btn{
    background:var(--chip-bg);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:6px;
    padding:7px 12px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .btn:hover, select:hover{background:#333;}
  .btn.active{background:var(--accent);color:#0c1a33;border-color:var(--accent);font-weight:600;}
  .archive-banner{
    display:none;
    background:#2a2410;
    border:1px solid #574a12;
    color:#e8cf74;
    font-size:13px;
    padding:10px 14px;
    border-radius:8px;
    margin:16px 0;
  }
  .archive-banner.show{display:block;}
  table{width:100%;border-collapse:collapse;margin-top:20px;}
  thead th{
    text-align:left;
    font-size:13px;
    font-weight:500;
    color:var(--text-dim);
    padding:10px 12px;
    border-bottom:1px solid var(--border);
  }
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:hover{background:var(--row-hover);}
  tbody td{padding:12px;vertical-align:middle;}
  .task-row-name{
    display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;font-size:14px;
  }
  .chevron{color:var(--text-faint);font-size:11px;transition:transform .15s;display:inline-block;width:10px;}
  .chevron.open{transform:rotate(90deg);}
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    padding:4px 10px 4px 8px;border-radius:999px;
    font-size:13px;font-weight:500;cursor:pointer;user-select:none;
    border:1px solid transparent;
  }
  .pill .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .pill.grey{background:var(--grey-pill-bg);color:var(--text-dim);}
  .pill.grey .dot{background:var(--grey-pill-dot);}
  .pill.red{background:var(--red-pill-bg);color:var(--red-pill-text);}
  .pill.red .dot{background:var(--red-pill-dot);}
  .pill.blue{background:var(--blue-pill-bg);color:var(--blue-pill-text);}
  .pill.blue .dot{background:var(--blue-pill-dot);}
  .pill.green{background:var(--green-pill-bg);color:var(--green-pill-text);}
  .pill.green .dot{background:var(--green-pill-dot);}
  .pill[disabled]{cursor:default;opacity:0.85;}
  .status-wrap{position:relative;display:inline-block;}
  .status-dropdown{padding:6px;min-width:150px;}
  .status-dropdown .dropdown-item{padding:4px;cursor:pointer;}
  .status-dropdown .dropdown-item:hover{background:#383838;}

  .chipfield{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;align-items:center;position:relative;}
  .chip{
    background:var(--chip-bg);border:1px solid var(--border);
    padding:3px 9px;border-radius:6px;font-size:12.5px;color:var(--text);
    white-space:nowrap;
  }
  .add-chip-btn{
    color:var(--text-faint);font-size:12.5px;cursor:pointer;padding:3px 8px;
    border-radius:6px;border:1px dashed var(--border);
  }
  .add-chip-btn:hover{color:var(--text);border-color:var(--text-faint);}
  .dropdown{
    position:absolute;top:30px;left:0;z-index:20;
    background:#2a2a2a;border:1px solid var(--border);border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    min-width:170px;padding:6px;
  }
  .dropdown-item{
    display:flex;align-items:center;gap:8px;
    padding:7px 8px;border-radius:5px;font-size:13px;cursor:pointer;
  }
  .dropdown-item:hover{background:#383838;}
  .dropdown-item:hover .name-actions{opacity:1;}
  .dropdown-item input[type=checkbox]{margin:0;}
  .dropdown-item .name-label{flex:1;}
  .dropdown-item .name-edit-input{
    flex:1;background:#1c1c1c;border:1px solid var(--accent);border-radius:4px;
    color:var(--text);padding:2px 6px;font-size:13px;font-family:inherit;
  }
  .name-actions{display:flex;gap:6px;opacity:0;transition:opacity .1s;}
  .name-actions span{
    font-size:11px;color:var(--text-faint);cursor:pointer;padding:2px 4px;border-radius:3px;
  }
  .name-actions span:hover{color:var(--text);background:#3a3a3a;}
  .dropdown-divider{height:1px;background:var(--border);margin:6px 2px;}
  .dropdown-add{display:flex;gap:6px;padding:4px 2px 2px;}
  .dropdown-add input{
    flex:1;background:#1c1c1c;border:1px solid var(--border);border-radius:5px;
    color:var(--text);padding:5px 8px;font-size:12.5px;font-family:inherit;min-width:0;
  }
  .dropdown-add button{
    background:var(--chip-bg);border:1px solid var(--border);color:var(--text);
    border-radius:5px;padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  }

  .task-panel{display:none;background:#171717;}
  .task-panel.open{display:table-row;}
  .task-panel td{padding:0 12px 16px 44px;}
  .task-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .task-group-header{
    font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--text-dim);margin:12px 0 2px;
  }
  .task-group-header:first-child{margin-top:6px;}
  .task-item{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-dim);flex-wrap:wrap;}
  .task-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);flex:none;}
  .task-item.done{color:var(--text-faint);text-decoration:line-through;}
  .task-item .main-text{flex:1;}
  .task-actions{display:flex;gap:10px;opacity:0;transition:opacity .1s;margin-left:auto;flex:none;}
  .task-actions .del{color:var(--text-faint);cursor:pointer;font-size:11.5px;opacity:1;margin-left:0;}
  .task-actions .del:hover{color:var(--text);}
  .task-item:hover .task-actions{opacity:1;}
  .task-edit-input{
    flex:1;background:#1c1c1c;border:1px solid var(--accent);border-radius:5px;
    color:var(--text);padding:4px 8px;font-size:13.5px;font-family:inherit;
  }
  .task-item.is-header-task{
    font-weight:700;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;
    color:var(--text-dim);margin-top:12px;
  }
  .task-item.is-header-task.done{color:var(--text-faint);}
  .task-note{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-faint);
    font-style:italic;
  }
  .task-note span:not(.task-actions):not(.note-spacer){flex:1;}
  .task-note:hover .task-actions{opacity:1;}
  .note-spacer{width:15px;flex:none;visibility:hidden;}
  .add-note-row{display:flex;align-items:center;gap:8px;margin-top:2px;}
  .add-note-row input{
    flex:1;background:#1c1c1c;border:1px solid var(--border);border-radius:5px;
    color:var(--text);padding:5px 9px;font-size:12.5px;font-style:italic;font-family:inherit;
  }
  .add-task-inline{display:flex;gap:8px;margin:8px 0 14px;}
  .add-task-inline input{
    flex:1;background:#1e1e1e;border:1px dashed var(--border);border-radius:6px;
    color:var(--text);padding:6px 10px;font-size:13px;font-family:inherit;
  }
  .add-task-inline button{
    background:var(--chip-bg);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }
  .add-task{display:flex;gap:8px;margin-top:8px;}
  .add-task input{
    flex:1;background:#222;border:1px solid var(--border);border-radius:6px;
    color:var(--text);padding:6px 10px;font-size:13px;font-family:inherit;
  }
  .add-task button{
    background:var(--chip-bg);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;
  }
  .empty-tasks{color:var(--text-faint);font-size:13px;font-style:italic;margin-top:6px;}
  .notes-cell-wrap{position:relative;display:inline-block;}
  .notes-toggle-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:6px;
    color:var(--text-faint);font-size:13px;cursor:pointer;
    border:1px dashed var(--border);user-select:none;
  }
  .notes-toggle-btn:hover{color:var(--text);border-color:var(--text-faint);}
  .notes-toggle-btn.has-notes{
    background:var(--blue-pill-bg);color:var(--blue-pill-text);
    border:1px solid var(--blue-pill-bg);font-weight:600;
  }
  .notes-dropdown{min-width:220px;max-width:280px;}
  .notes-item{align-items:flex-start;}
  .notes-text{white-space:normal;word-break:break-word;line-height:1.4;padding:2px 0;}
  .footer-note{color:var(--text-faint);font-size:12px;margin-top:28px;}
  .loading{color:var(--text-dim);padding:40px 0;text-align:center;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Server Sidework</h1>
      <p class="subtitle" id="weekLabel">Loading week…</p>
    </div>
    <div class="controls">
      <select id="weekPicker"></select>
      <button class="btn" id="managerToggle">Manager view</button>
    </div>
  </div>

  <div class="archive-banner" id="archiveBanner">Viewing an archived week. Edits here update that week's saved record, not the current week.</div>

  <table>
    <thead>
      <tr>
        <th style="width:24%">Name</th>
        <th style="width:14%">Status</th>
        <th style="width:24%">Completed by</th>
        <th style="width:24%">Checked by</th>
        <th style="width:14%">Notes</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="5" class="loading">Loading checklist…</td></tr>
    </tbody>
  </table>

  <p class="footer-note">Resets automatically every Monday at 6:00 AM. Managers can review any previous week using the dropdown above.</p>
</div>

<script>
const FIREBASE_DB_URL = "https://server-sidework-default-rtdb.firebaseio.com";
const storage = {
  async get(key){
    const res = await fetch(`${FIREBASE_DB_URL}/data/${encodeURIComponent(key)}.json`);
    if (!res.ok) throw new Error('Firebase get failed: ' + res.status);
    const value = await res.json();
    if (value === null || value === undefined) return null;
    return { key, value, shared: true };
  },
  async set(key, value){
    const res = await fetch(`${FIREBASE_DB_URL}/data/${encodeURIComponent(key)}.json`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(value)
    });
    if (!res.ok) throw new Error('Firebase set failed: ' + res.status);
    return { key, value, shared: true };
  },
  async delete(key){
    const res = await fetch(`${FIREBASE_DB_URL}/data/${encodeURIComponent(key)}.json`, { method: 'DELETE' });
    if (!res.ok) throw new Error('Firebase delete failed: ' + res.status);
    return { key, deleted: true, shared: true };
  },
  async list(prefix){
    const res = await fetch(`${FIREBASE_DB_URL}/data.json?shallow=true`);
    if (!res.ok) throw new Error('Firebase list failed: ' + res.status);
    const obj = await res.json();
    const allKeys = obj ? Object.keys(obj) : [];
    const keys = prefix ? allKeys.filter(k => k.startsWith(prefix)) : allKeys;
    return { keys, prefix, shared: true };
  }
};

const SHIFTS = ["Monday AM","Monday PM","Tuesday AM","Tuesday PM","Wednesday AM","Wednesday PM",
  "Thursday AM","Thursday PM","Friday AM","Friday PM","Saturday AM","Saturday PM","Sunday AM","Sunday PM"];

const COLOR_PALETTE = [
  {bg:"#454545", text:"#dcdcda"},   // gray
  {bg:"#5a4633", text:"#e3c9a3"},   // brown
  {bg:"#5c4420", text:"#f0c383"},   // orange
  {bg:"#5c531f", text:"#e8dc8a"},   // olive/yellow
  {bg:"#25502c", text:"#95e0ac"},   // green
  {bg:"#1f4566", text:"#93c1f5"},   // blue
  {bg:"#4a2f66", text:"#cca8f0"},   // purple
  {bg:"#63304a", text:"#f0a8c6"},   // pink
  {bg:"#603030", text:"#f0a3a3"}    // red
];
function randomColor(usedList){
  const usedBgs = usedList.map(p => p.color && p.color.bg);
  const unused = COLOR_PALETTE.filter(c => !usedBgs.includes(c.bg));
  const pool = unused.length ? unused : COLOR_PALETTE;
  return pool[Math.floor(Math.random() * pool.length)];
}
function migrateRoster(raw){
  // supports old format (array of plain name strings) and new format (array of {name,color})
  return raw.map(entry => {
    if (typeof entry === 'string') return {name: entry, color: randomColor([])};
    return entry;
  });
}

let EMPLOYEES = ["Nishan","Grace","Daniel","Steven","Chris","Edwin","Charlotte","Jake","Franchesca","Silver","Conyers"].map(n => ({name:n, color:null}));
let MANAGERS = ["Ashley","Ben","Ariel","Jonda","Vanessa"].map(n => ({name:n, color:null}));
EMPLOYEES.forEach(p => p.color = randomColor(EMPLOYEES));
MANAGERS.forEach(p => p.color = randomColor(MANAGERS));

let editingName = null;

function rosterFor(field){ return field === 'completedBy' ? EMPLOYEES : MANAGERS; }
function colorFor(field, name){
  const entry = rosterFor(field).find(p => p.name === name);
  return (entry && entry.color) ? entry.color : COLOR_PALETTE[0];
}

async function loadRoster(){
  try{
    const emp = await storage.get('roster:employees', true);
    if (emp) EMPLOYEES = migrateRoster(JSON.parse(emp.value));
  }catch(e){}
  try{
    const mgr = await storage.get('roster:managers', true);
    if (mgr) MANAGERS = migrateRoster(JSON.parse(mgr.value));
  }catch(e){}
}
async function saveRoster(field){
  const key = field === 'completedBy' ? 'roster:employees' : 'roster:managers';
  const list = field === 'completedBy' ? EMPLOYEES : MANAGERS;
  try{ await storage.set(key, JSON.stringify(list), true); }catch(e){}
}
function renameAcrossCurrentWeek(field, oldName, newName){
  SHIFTS.forEach(shift => {
    const arr = currentData[shift][field];
    const i = arr.indexOf(oldName);
    if (i !== -1) arr[i] = newName;
  });
}
function removeAcrossCurrentWeek(field, name){
  SHIFTS.forEach(shift => {
    const arr = currentData[shift][field];
    const i = arr.indexOf(name);
    if (i !== -1) arr.splice(i,1);
  });
}
const STATUS_CYCLE = ["not_started","not_completed","completed"];
const STATUS_META = {
  not_started: {label:"Not started", cls:"grey"},
  not_completed: {label:"Partially Completed", cls:"blue"},
  completed: {label:"Completed", cls:"green"}
};

let currentData = null;   // the week object currently rendered
let currentKey = null;    // storage key of the week being viewed
let isReadOnly = false;
let managerMode = false;
let openTaskRow = null;
let openDropdown = null; // {row, field}
let openStatusDropdown = null; // shift name, or null
let openNotesFor = null;   // shift name whose Notes dropdown is open, or null
let editingRowNote = null; // {shift, noteIdx}
let editingTask = null;  // {shift, groupIdx, itemIdx}
let editingNote = null;  // {shift, groupIdx, itemIdx, noteIdx}
let addingNoteFor = null; // {shift, groupIdx, itemIdx}

function getWeekStart(now){
  const d = new Date(now);
  const day = d.getDay();
  const daysSinceMonday = (day + 6) % 7;
  let monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - daysSinceMonday, 6,0,0,0);
  if (d < monday){ monday.setDate(monday.getDate() - 7); }
  return monday;
}
function keyFor(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `week:${y}-${m}-${d}`;
}
function labelFor(mondayDate){
  const end = new Date(mondayDate); end.setDate(end.getDate()+6);
  const opts = {month:'short', day:'numeric'};
  return `Week of ${mondayDate.toLocaleDateString('en-US',opts)} – ${end.toLocaleDateString('en-US',opts)}`;
}
const EVERYDAY_PM_TASK = "Send all trays through dish at the end of the shift.";

const TASK_SEED = {
  "Monday AM": [],
  "Monday PM": [
    {header:null, items:[
      "Clean and organize MDR wine fridge (empty water buckets). Soak up any standing water with a rag.",
      EVERYDAY_PM_TASK
    ]}
  ],
  "Tuesday AM": [
    {header:null, items:["Empty and send all sugar caddies to dish."]}
  ],
  "Tuesday PM": [
    {header:null, items:[
      "Refill all sugar caddies.",
      EVERYDAY_PM_TASK
    ]}
  ],
  "Wednesday AM": [
    {header:null, items:[
      "Clean and organize beer/juice fridge in the winter garden. Change the aluminum foil on the bottom. Ask the kitchen for foil."
    ]}
  ],
  "Wednesday PM": [
    {header:null, items:[
      "Clean and organize the coffee fridge (including emptying water buckets) and change aluminum foil on the bottom. Ask the kitchen for foil.",
      EVERYDAY_PM_TASK
    ]}
  ],
  "Thursday AM": [
    {header:null, items:["Clean and organize the winter garden closet (aka Confessional)."]}
  ],
  "Thursday PM": [
    {header:null, items:[
      "Clean and organize the MDR soda/beer closet. Get rid of any empty cardboard boxes.",
      EVERYDAY_PM_TASK
    ]}
  ],
  "Friday AM": [
    {header:null, items:[
      "Clean and organize the wine hutch. Dust the ornaments and run the liner through the dishwasher. Roll the liners with a rubber band so that they don't unravel in the dishwasher. Unroll before they cool down."
    ]}
  ],
  "Friday PM": [
    {header:null, items:[EVERYDAY_PM_TASK]}
  ],
  "Saturday AM": [],
  "Saturday PM": [
    {header:null, items:[EVERYDAY_PM_TASK]}
  ],
  "Sunday AM": [
    {header:null, items:["At the end of brunch, send all milk containers to dish to be washed."]}
  ],
  "Sunday PM": [
    {header:null, items:[
      "Soak the two coffee pots and the espresso portafilters overnight.",
      EVERYDAY_PM_TASK
    ]}
  ]
};

function seedTasksFor(shift){
  const groups = TASK_SEED[shift] || [];
  return groups.map(g => ({
    header: g.header,
    done: false,
    notes: [],
    items: g.items.map(t => ({text: t, done:false, notes:[]}))
  }));
}
function migrateTasks(raw, shift){
  if (!raw || raw.length === 0) return seedTasksFor(shift);
  if (raw[0] && raw[0].items !== undefined){
    raw.forEach(g => {
      if (!g.items) g.items = [];
      if (g.done === undefined) g.done = false;
      if (!g.notes) g.notes = [];
      g.items.forEach(it => { if (!it.notes) it.notes = []; });
    });
    return raw; // already grouped format
  }
  return [{header:null, done:false, notes:[], items: raw.map(it => ({...it, notes: it.notes || []}))}]; // old flat format
}

function blankWeek(){
  const rows = {};
  SHIFTS.forEach(s => { rows[s] = {status:"not_started", completedBy:[], checkedBy:[], rowNotes:[], tasks: seedTasksFor(s)}; });
  return rows;
}

async function loadWeek(dateKeyDate){
  const key = keyFor(dateKeyDate);
  try{
    const res = await storage.get(key, true);
    const data = res ? JSON.parse(res.value) : blankWeek();
    SHIFTS.forEach(s => {
      data[s].tasks = migrateTasks(data[s].tasks, s);
      if (!data[s].rowNotes) data[s].rowNotes = [];
    });
    return data;
  }catch(e){
    return blankWeek();
  }
}
async function saveCurrentWeek(){
  if (isReadOnly) return;
  try{
    await storage.set(currentKey, JSON.stringify(currentData), true);
  }catch(e){ console.error("Save failed", e); }
}

async function populateWeekPicker(){
  const picker = document.getElementById('weekPicker');
  picker.innerHTML = '';
  const thisMonday = getWeekStart(new Date());
  const thisKey = keyFor(thisMonday);

  let archivedKeys = [];
  try{
    const res = await storage.list('week:', true);
    if (res && res.keys) archivedKeys = res.keys;
  }catch(e){}

  const optThis = document.createElement('option');
  optThis.value = thisKey; optThis.textContent = `This week (${labelFor(thisMonday)})`;
  picker.appendChild(optThis);

  const others = archivedKeys.filter(k => k !== thisKey).sort().reverse();
  others.forEach(k => {
    const dateStr = k.replace('week:','');
    const d = new Date(dateStr + 'T06:00:00');
    const opt = document.createElement('option');
    opt.value = k; opt.textContent = labelFor(d);
    picker.appendChild(opt);
  });

  picker.value = thisKey;
}

async function switchToWeek(key){
  currentKey = key;
  const thisMonday = getWeekStart(new Date());
  const thisKey = keyFor(thisMonday);
  const isArchivedWeek = (key !== thisKey);
  isReadOnly = false; // editing is allowed on past weeks too, not just the current week
  document.getElementById('archiveBanner').classList.toggle('show', isArchivedWeek);

  const dateStr = key.replace('week:','');
  const d = new Date(dateStr + 'T06:00:00');
  document.getElementById('weekLabel').textContent = labelFor(d) + (isArchivedWeek ? ' — archived' : ' — current');

  currentData = await loadWeek(d);
  render();
}

function setStatus(shift, newStatus){
  if (isReadOnly) return;
  currentData[shift].status = newStatus;
  openStatusDropdown = null;
  saveCurrentWeek();
  render();
}

function buildStatusCell(shift, row, meta){
  const wrap = document.createElement('div');
  wrap.className = 'status-wrap';

  const pill = document.createElement('span');
  pill.className = `pill ${meta.cls}`;
  pill.innerHTML = `<span class="dot"></span>${meta.label}`;
  if (!isReadOnly){
    pill.onclick = (e) => {
      e.stopPropagation();
      openStatusDropdown = (openStatusDropdown === shift) ? null : shift;
      render();
    };
  } else {
    pill.setAttribute('disabled','');
  }
  wrap.appendChild(pill);

  if (openStatusDropdown === shift && !isReadOnly){
    const dd = document.createElement('div');
    dd.className = 'dropdown status-dropdown';
    dd.onclick = (e) => e.stopPropagation();
    STATUS_CYCLE.forEach(key => {
      const m = STATUS_META[key];
      const item = document.createElement('div');
      item.className = 'dropdown-item';
      item.innerHTML = `<span class="pill ${m.cls}" style="cursor:pointer"><span class="dot"></span>${m.label}</span>`;
      item.onclick = () => setStatus(shift, key);
      dd.appendChild(item);
    });
    wrap.appendChild(dd);
  }

  return wrap;
}

function toggleChip(shift, field, name){
  if (isReadOnly) return;
  const arr = currentData[shift][field];
  const i = arr.indexOf(name);
  if (i === -1) arr.push(name); else arr.splice(i,1);
  saveCurrentWeek();
  render();
}

function getTaskRef(shift, groupIdx, itemIdx){
  const group = currentData[shift].tasks[groupIdx];
  if (itemIdx === 'header') return group;
  return group.items[itemIdx];
}

function addRowNote(shift, text){
  if (isReadOnly || !text.trim()) return;
  currentData[shift].rowNotes.push(text.trim());
  saveCurrentWeek();
  render();
}
function editRowNoteText(shift, noteIdx, newText){
  if (isReadOnly) return;
  const trimmed = newText.trim();
  if (trimmed) currentData[shift].rowNotes[noteIdx] = trimmed;
  editingRowNote = null;
  saveCurrentWeek();
  render();
}
function deleteRowNote(shift, noteIdx){
  if (isReadOnly) return;
  currentData[shift].rowNotes.splice(noteIdx,1);
  saveCurrentWeek();
  render();
}

function buildNotesCell(shift){
  const td = document.createElement('td');
  const wrap = document.createElement('div');
  wrap.className = 'notes-cell-wrap';

  const notes = currentData[shift].rowNotes || [];
  const hasNotes = notes.length > 0;

  const toggleBtn = document.createElement('span');
  toggleBtn.className = `notes-toggle-btn ${hasNotes ? 'has-notes' : ''}`;
  toggleBtn.textContent = hasNotes ? notes.length : '+';
  toggleBtn.title = hasNotes ? `${notes.length} note${notes.length>1?'s':''}` : 'Add a note';
  toggleBtn.onclick = (e) => {
    e.stopPropagation();
    openNotesFor = (openNotesFor === shift) ? null : shift;
    render();
  };
  wrap.appendChild(toggleBtn);

  if (openNotesFor === shift){
    const dd = document.createElement('div');
    dd.className = 'dropdown notes-dropdown';
    dd.onclick = (e) => e.stopPropagation();

    if (notes.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-tasks';
      empty.style.padding = '4px 6px 8px';
      empty.textContent = 'No notes yet.';
      dd.appendChild(empty);
    } else {
      notes.forEach((note, noteIdx) => {
        const isEditingThis = editingRowNote && editingRowNote.shift===shift && editingRowNote.noteIdx===noteIdx;
        const row = document.createElement('div');
        row.className = 'dropdown-item notes-item';
        if (isEditingThis){
          const input = document.createElement('input');
          input.className = 'name-edit-input';
          input.value = note;
          input.onclick = (e) => e.stopPropagation();
          const commit = () => editRowNoteText(shift, noteIdx, input.value);
          input.onkeydown = (e) => { if (e.key==='Enter') commit(); if (e.key==='Escape'){editingRowNote=null; render();} };
          input.onblur = commit;
          row.appendChild(input);
          setTimeout(() => input.focus(), 0);
        } else {
          const label = document.createElement('span');
          label.className = 'name-label notes-text';
          label.textContent = note;
          row.appendChild(label);

          const actions = document.createElement('span');
          actions.className = 'name-actions';
          const editBtn = document.createElement('span');
          editBtn.textContent = '✎'; editBtn.title = 'Edit';
          editBtn.onclick = (e) => { e.stopPropagation(); editingRowNote = {shift, noteIdx}; render(); };
          const delBtn = document.createElement('span');
          delBtn.textContent = '✕'; delBtn.title = 'Remove';
          delBtn.onclick = (e) => { e.stopPropagation(); deleteRowNote(shift, noteIdx); };
          actions.appendChild(editBtn); actions.appendChild(delBtn);
          row.appendChild(actions);
        }
        dd.appendChild(row);
      });
    }

    const divider = document.createElement('div');
    divider.className = 'dropdown-divider';
    dd.appendChild(divider);

    const addRow = document.createElement('div');
    addRow.className = 'dropdown-add';
    const addInput = document.createElement('input');
    addInput.placeholder = 'Add a note…';
    addInput.onclick = (e) => e.stopPropagation();
    const addBtn = document.createElement('button');
    addBtn.textContent = 'Add';
    const submitAdd = () => { addRowNote(shift, addInput.value); addInput.value = ''; };
    addBtn.onclick = (e) => { e.stopPropagation(); submitAdd(); };
    addInput.onkeydown = (e) => { if (e.key==='Enter'){ e.stopPropagation(); submitAdd(); } };
    addRow.appendChild(addInput); addRow.appendChild(addBtn);
    dd.appendChild(addRow);

    wrap.appendChild(dd);
  }

  td.appendChild(wrap);
  return td;
}

function addTask(shift, text){
  if (isReadOnly || !text.trim()) return;
  currentData[shift].tasks.push({header: text.trim(), done:false, notes:[], items:[]});
  saveCurrentWeek();
  render();
}
function addTaskToGroup(shift, groupIdx, text){
  if (isReadOnly || !text.trim()) return;
  currentData[shift].tasks[groupIdx].items.push({text: text.trim(), done:false, notes:[]});
  saveCurrentWeek();
  render();
}
function toggleTask(shift, groupIdx, itemIdx){
  if (isReadOnly) return;
  const ref = getTaskRef(shift, groupIdx, itemIdx);
  ref.done = !ref.done;
  saveCurrentWeek();
  render();
}
function deleteTask(shift, groupIdx, itemIdx){
  if (isReadOnly) return;
  if (itemIdx === 'header'){
    currentData[shift].tasks.splice(groupIdx,1);
  } else {
    const group = currentData[shift].tasks[groupIdx];
    group.items.splice(itemIdx,1);
    if (group.items.length === 0 && group.header === null) currentData[shift].tasks.splice(groupIdx,1);
  }
  saveCurrentWeek();
  render();
}
function editTaskText(shift, groupIdx, itemIdx, newText){
  if (isReadOnly) return;
  const trimmed = newText.trim();
  const ref = getTaskRef(shift, groupIdx, itemIdx);
  if (trimmed){ if (itemIdx==='header') ref.header = trimmed; else ref.text = trimmed; }
  editingTask = null;
  saveCurrentWeek();
  render();
}
function addNote(shift, groupIdx, itemIdx, text){
  if (isReadOnly || !text.trim()) return;
  const ref = getTaskRef(shift, groupIdx, itemIdx);
  if (!ref.notes) ref.notes = [];
  ref.notes.push(text.trim());
  addingNoteFor = null;
  saveCurrentWeek();
  render();
}
function editNoteText(shift, groupIdx, itemIdx, noteIdx, newText){
  if (isReadOnly) return;
  const trimmed = newText.trim();
  const ref = getTaskRef(shift, groupIdx, itemIdx);
  if (trimmed) ref.notes[noteIdx] = trimmed;
  editingNote = null;
  saveCurrentWeek();
  render();
}
function deleteNote(shift, groupIdx, itemIdx, noteIdx){
  if (isReadOnly) return;
  const ref = getTaskRef(shift, groupIdx, itemIdx);
  ref.notes.splice(noteIdx,1);
  saveCurrentWeek();
  render();
}

function renderTaskRow(list, shift, groupIdx, itemIdx, t, isHeaderTask, indent){
  const isEditingThis = editingTask && editingTask.shift===shift && editingTask.groupIdx===groupIdx && editingTask.itemIdx===itemIdx;
  const text = isHeaderTask ? t.header : t.text;
  const item = document.createElement('div');
  item.className = `task-item ${t.done?'done':''} ${isHeaderTask?'is-header-task':''}`;
  if (indent && !isHeaderTask) item.style.paddingLeft = '20px';

  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = !!t.done;
  cb.disabled = isReadOnly;
  cb.onchange = () => toggleTask(shift, groupIdx, itemIdx);
  item.appendChild(cb);

  if (isEditingThis){
    const input = document.createElement('input');
    input.className = 'task-edit-input';
    input.value = text;
    const commit = () => editTaskText(shift, groupIdx, itemIdx, input.value);
    input.onkeydown = (e) => { if (e.key==='Enter') commit(); if (e.key==='Escape'){editingTask=null; render();} };
    input.onblur = commit;
    item.appendChild(input);
    setTimeout(() => input.focus(), 0);
  } else {
    const span = document.createElement('span');
    span.textContent = text;
    span.className = 'main-text';
    item.appendChild(span);
  }

  if (!isReadOnly && !isEditingThis){
    const actions = document.createElement('span');
    actions.className = 'task-actions';
    const editBtn = document.createElement('span');
    editBtn.className = 'del'; editBtn.textContent = 'Edit';
    editBtn.onclick = () => { editingTask = {shift, groupIdx, itemIdx}; render(); };
    const noteBtn = document.createElement('span');
    noteBtn.className = 'del'; noteBtn.textContent = 'Add note';
    noteBtn.onclick = () => { addingNoteFor = {shift, groupIdx, itemIdx}; render(); };
    const del = document.createElement('span');
    del.className = 'del'; del.textContent = 'Remove';
    del.onclick = () => deleteTask(shift, groupIdx, itemIdx);
    actions.appendChild(editBtn); actions.appendChild(noteBtn); actions.appendChild(del);
    item.appendChild(actions);
  }
  list.appendChild(item);

  // Notes render on their own line, flush-left with the task's TEXT (not its checkbox)
  (t.notes || []).forEach((note, noteIdx) => {
    const isEditingNote = editingNote && editingNote.shift===shift && editingNote.groupIdx===groupIdx && editingNote.itemIdx===itemIdx && editingNote.noteIdx===noteIdx;
    const noteRow = document.createElement('div');
    noteRow.className = 'task-note';
    if (indent && !isHeaderTask) noteRow.style.paddingLeft = '20px';
    const spacer = document.createElement('span');
    spacer.className = 'note-spacer';
    noteRow.appendChild(spacer);
    if (isEditingNote){
      const input = document.createElement('input');
      input.className = 'task-edit-input';
      input.value = note;
      const commit = () => editNoteText(shift, groupIdx, itemIdx, noteIdx, input.value);
      input.onkeydown = (e) => { if (e.key==='Enter') commit(); if (e.key==='Escape'){editingNote=null; render();} };
      input.onblur = commit;
      noteRow.appendChild(input);
      setTimeout(() => input.focus(), 0);
    } else {
      const span = document.createElement('span');
      span.textContent = note;
      noteRow.appendChild(span);
      if (!isReadOnly){
        const actions = document.createElement('span');
        actions.className = 'task-actions';
        const editBtn = document.createElement('span');
        editBtn.className = 'del'; editBtn.textContent = 'Edit';
        editBtn.onclick = () => { editingNote = {shift, groupIdx, itemIdx, noteIdx}; render(); };
        const del = document.createElement('span');
        del.className = 'del'; del.textContent = 'Remove';
        del.onclick = () => deleteNote(shift, groupIdx, itemIdx, noteIdx);
        actions.appendChild(editBtn); actions.appendChild(del);
        noteRow.appendChild(actions);
      }
    }
    list.appendChild(noteRow);
  });

  const isAddingNoteHere = addingNoteFor && addingNoteFor.shift===shift && addingNoteFor.groupIdx===groupIdx && addingNoteFor.itemIdx===itemIdx;
  if (isAddingNoteHere){
    const noteInputRow = document.createElement('div');
    noteInputRow.className = 'add-note-row';
    if (indent && !isHeaderTask) noteInputRow.style.paddingLeft = '20px';
    const spacer = document.createElement('span');
    spacer.className = 'note-spacer';
    noteInputRow.appendChild(spacer);
    const input = document.createElement('input');
    input.placeholder = 'Add an explanation for this task…';
    let submitted = false;
    const submit = () => {
      if (submitted) return;
      submitted = true;
      addNote(shift, groupIdx, itemIdx, input.value);
    };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') submit();
      if (e.key==='Escape'){ submitted = true; addingNoteFor=null; render(); }
    };
    input.onblur = () => {
      if (submitted) return;
      if (input.value.trim()) submit();
      else { submitted = true; addingNoteFor=null; render(); }
    };
    noteInputRow.appendChild(input);
    list.appendChild(noteInputRow);
    setTimeout(() => input.focus(), 0);
  }
}

function render(){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  SHIFTS.forEach(shift => {
    const row = currentData[shift];
    const meta = STATUS_META[row.status];

    const tr = document.createElement('tr');

    // Name cell
    const tdName = document.createElement('td');
    const nameWrap = document.createElement('div');
    nameWrap.className = 'task-row-name';
    nameWrap.innerHTML = `<span class="chevron ${openTaskRow===shift?'open':''}">▶</span> ${shift}`;
    nameWrap.onclick = () => { openTaskRow = (openTaskRow===shift ? null : shift); render(); };
    tdName.appendChild(nameWrap);
    tr.appendChild(tdName);

    // Status cell
    const tdStatus = document.createElement('td');
    tdStatus.appendChild(buildStatusCell(shift, row, meta));
    tr.appendChild(tdStatus);

    // Completed by / Checked by
    tr.appendChild(buildChipCell(shift, 'completedBy', EMPLOYEES));
    tr.appendChild(buildChipCell(shift, 'checkedBy', MANAGERS));

    // Notes
    tr.appendChild(buildNotesCell(shift));

    tbody.appendChild(tr);

    // Task sub-panel
    const panelTr = document.createElement('tr');
    panelTr.className = `task-panel ${openTaskRow===shift ? 'open':''}`;
    const panelTd = document.createElement('td');
    panelTd.colSpan = 5;

    const list = document.createElement('div');
    list.className = 'task-list';
    if (row.tasks.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-tasks';
      empty.textContent = 'No tasks added for this shift yet.';
      list.appendChild(empty);
    } else {
      row.tasks.forEach((group, groupIdx) => {
        if (group.header){
          renderTaskRow(list, shift, groupIdx, 'header', group, true);
        }

        group.items.forEach((t, itemIdx) => {
          renderTaskRow(list, shift, groupIdx, itemIdx, t, false, !!group.header);
        });

        if (!isReadOnly){
          const addToGroupRow = document.createElement('div');
          addToGroupRow.className = 'add-task-inline';
          const input = document.createElement('input');
          input.placeholder = 'Add a checkbox task to this group…';
          const btn = document.createElement('button');
          btn.textContent = 'Add';
          const submit = () => { addTaskToGroup(shift, groupIdx, input.value); input.value=''; };
          btn.onclick = submit;
          input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
          addToGroupRow.appendChild(input); addToGroupRow.appendChild(btn);
          list.appendChild(addToGroupRow);
        }
      });
    }
    panelTd.appendChild(list);

    if (!isReadOnly){
      const addRow = document.createElement('div');
      addRow.className = 'add-task';
      const input = document.createElement('input');
      input.placeholder = 'Add a task for this shift…';
      const btn = document.createElement('button');
      btn.textContent = 'Add';
      const submit = () => { addTask(shift, input.value); input.value=''; };
      btn.onclick = submit;
      input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
      addRow.appendChild(input); addRow.appendChild(btn);
      panelTd.appendChild(addRow);
    }

    panelTr.appendChild(panelTd);
    tbody.appendChild(panelTr);
  });
}

function buildChipCell(shift, field, options){
  const td = document.createElement('td');
  const wrap = document.createElement('div');
  wrap.className = 'chipfield';

  currentData[shift][field].forEach(name => {
    const c = colorFor(field, name);
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.style.background = c.bg;
    chip.style.color = c.text;
    chip.style.border = 'none';
    chip.textContent = name;
    wrap.appendChild(chip);
  });

  if (!isReadOnly){
    const addBtn = document.createElement('span');
    addBtn.className = 'add-chip-btn';
    addBtn.textContent = '+';
    addBtn.onclick = (e) => {
      e.stopPropagation();
      const isOpen = openDropdown && openDropdown.row===shift && openDropdown.field===field;
      openDropdown = isOpen ? null : {row:shift, field:field};
      render();
    };
    wrap.appendChild(addBtn);

    if (openDropdown && openDropdown.row===shift && openDropdown.field===field){
      const dd = document.createElement('div');
      dd.className = 'dropdown';
      dd.onclick = (e) => e.stopPropagation();

      rosterFor(field).forEach(person => {
        const name = person.name;
        const c = person.color || COLOR_PALETTE[0];
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        const isEditing = editingName && editingName.field===field && editingName.name===name;

        if (isEditing){
          const input = document.createElement('input');
          input.className = 'name-edit-input';
          input.value = name;
          input.onclick = (e) => e.stopPropagation();
          const commit = () => {
            const newName = input.value.trim();
            if (newName && newName !== name){
              const list = rosterFor(field);
              const entry = list.find(p => p.name === name);
              if (entry) entry.name = newName;
              renameAcrossCurrentWeek(field, name, newName);
              saveRoster(field); saveCurrentWeek();
            }
            editingName = null;
            render();
          };
          input.onkeydown = (e) => { if (e.key==='Enter') commit(); if (e.key==='Escape'){editingName=null; render();} };
          input.onblur = commit;
          item.appendChild(input);
          setTimeout(() => input.focus(), 0);
        } else {
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = currentData[shift][field].includes(name);
          cb.onclick = (e) => { e.stopPropagation(); toggleChip(shift, field, name); };
          const label = document.createElement('span');
          label.className = 'name-label';
          label.textContent = name;
          label.style.background = c.bg;
          label.style.color = c.text;
          label.style.padding = '3px 9px';
          label.style.borderRadius = '5px';
          label.style.display = 'inline-block';
          label.onclick = (e) => { e.stopPropagation(); toggleChip(shift, field, name); };

          const actions = document.createElement('span');
          actions.className = 'name-actions';
          const editBtn = document.createElement('span');
          editBtn.textContent = '✎';
          editBtn.title = 'Rename';
          editBtn.onclick = (e) => { e.stopPropagation(); editingName = {field, name}; render(); };
          const delBtn = document.createElement('span');
          delBtn.textContent = '✕';
          delBtn.title = 'Remove';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            const list = rosterFor(field);
            const idx = list.findIndex(p => p.name === name);
            if (idx !== -1) list.splice(idx,1);
            removeAcrossCurrentWeek(field, name);
            saveRoster(field); saveCurrentWeek();
            render();
          };
          actions.appendChild(editBtn); actions.appendChild(delBtn);

          item.appendChild(cb); item.appendChild(label); item.appendChild(actions);
        }
        dd.appendChild(item);
      });

      const divider = document.createElement('div');
      divider.className = 'dropdown-divider';
      dd.appendChild(divider);

      const addRow = document.createElement('div');
      addRow.className = 'dropdown-add';
      const addInput = document.createElement('input');
      addInput.placeholder = 'Add name…';
      addInput.onclick = (e) => e.stopPropagation();
      const addBtn2 = document.createElement('button');
      addBtn2.textContent = 'Add';
      const submitAdd = () => {
        const newName = addInput.value.trim();
        if (!newName) return;
        const list = rosterFor(field);
        if (!list.some(p => p.name === newName)){
          list.push({name: newName, color: randomColor(list)});
          saveRoster(field);
        }
        addInput.value = '';
        render();
      };
      addBtn2.onclick = (e) => { e.stopPropagation(); submitAdd(); };
      addInput.onkeydown = (e) => { if (e.key==='Enter'){ e.stopPropagation(); submitAdd(); } };
      addRow.appendChild(addInput); addRow.appendChild(addBtn2);
      dd.appendChild(addRow);

      wrap.appendChild(dd);
    }
  }

  td.appendChild(wrap);
  return td;
}

document.addEventListener('click', () => {
  if (openDropdown || openStatusDropdown || openNotesFor){ openDropdown = null; openStatusDropdown = null; openNotesFor = null; render(); }
});

document.getElementById('weekPicker').addEventListener('change', (e) => {
  switchToWeek(e.target.value);
});
document.getElementById('weekPicker').addEventListener('click', (e) => e.stopPropagation());

document.getElementById('managerToggle').addEventListener('click', (e) => {
  e.stopPropagation();
  managerMode = !managerMode;
  e.target.classList.toggle('active', managerMode);
  e.target.textContent = managerMode ? 'Manager view: ON' : 'Manager view';
});

(async function init(){
  await loadRoster();
  await populateWeekPicker();
  const thisMonday = getWeekStart(new Date());
  await switchToWeek(keyFor(thisMonday));
})();
</script>
</body>
